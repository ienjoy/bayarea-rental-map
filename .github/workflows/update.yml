name: 抓取更新租房地图（手动触发）

# 定时任务已于 2026-08-30 停用。
#
# 原因：bay123 和 chineseinsfbay 都开始封 GitHub 机房 IP，云端一条也抓不到 ——
#   [bay123] list page 1 failed: 403 Client Error: Forbidden
#   [cis]    响应长度 0 字符
# 同样的 URL 从住宅网络访问都是 200（bay123 107KB / cis 119KB），
# 所以是 IP 封锁，不是选择器失效或论坛改版。
#
# 定时任务留着只会每天准点失败、发一封无用的报错邮件，
# 天天报警会让人对失败麻木，真出别的问题反而漏掉。
#
# 现在数据更新完全靠本机跑 ./update.sh（住宅 IP 才抓得到）。
# 如果哪天想试试对方是否解封了，在 Actions 页面手动触发一次即可：
# 抓到了就说明能恢复定时，还是 403 就说明照旧。

on:
  workflow_dispatch: {}   # 只保留手动触发

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行抓取脚本
        run: python scraper/scrape.py

      - name: 提交更新
        run: |
          git config user.name "rental-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json state/seen.json state/last_run.json
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "自动更新房源数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 放在提交之后：就算某个论坛抓挂了，当天抓到的好数据也已经存下来了
      - name: 检查数据源健康状况
        run: |
          down=$(python -c "import json;print(','.join(json.load(open('state/last_run.json'))['down']))")
          if [ -n "$down" ]; then
            echo "::error::以下论坛这次一条都没抓到：$down（房源已保护不淘汰，但需要检查是被挡 IP 还是论坛改版）"
            exit 1
          fi
          echo "所有数据源正常"
